<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Face Icon -->
  <g transform="translate(24, 24)">
    <!-- Face circle -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#08080F" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Left spiral eye - much larger for visible spiral -->
    <g transform="translate(-5, -3)">
      <path d="M0,0 m-4,0 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0" fill="none" stroke="#08080F" stroke-width="1.5" stroke-opacity="0.9"/>
      <path d="M0,0 m-2.5,0 a2.5,2.5 0 1,1 5,0 a2.5,2.5 0 1,1 -5,0" fill="none" stroke="#08080F" stroke-width="1" stroke-opacity="0.9"/>
      <circle cx="0" cy="0" r="0.6" fill="#08080F" fill-opacity="0.9"/>
    </g>
    
    <!-- Right spiral eye - much larger for visible spiral -->
    <g transform="translate(5, -3)">
      <path d="M0,0 m-4,0 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0" fill="none" stroke="#08080F" stroke-width="1.5" stroke-opacity="0.9"/>
      <path d="M0,0 m-2.5,0 a2.5,2.5 0 1,1 5,0 a2.5,2.5 0 1,1 -5,0" fill="none" stroke="#08080F" stroke-width="1" stroke-opacity="0.9"/>
      <circle cx="0" cy="0" r="0.6" fill="#08080F" fill-opacity="0.9"/>
    </g>
    
    <!-- V-shaped mouth - pointing down, lower position -->
    <path d="M-4,3 L0,6 L4,3" fill="none" stroke="#08080F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  </g>
  
  <!-- Text -->
  <text x="56" y="30" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#08080F">
    datmovie
  </text>
</svg>