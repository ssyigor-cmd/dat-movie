<svg width="180" height="180" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- datmovie apple-touch-icon (iOS/iPadOS "Adicionar à Tela de Início").
       Fundo opaco, sem transparência e SEM cantos arredondados: o iOS aplica
       máscara própria, e qualquer alfa aqui vira preto. Versão clara: papel
       (#F4F1EA) com a marca em bronze (#7A663B). Mesmo mark do favicon light. -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2E9D5"/>
      <stop offset="0.35" stop-color="#E5D8BF"/>
      <stop offset="0.7" stop-color="#A89467"/>
      <stop offset="1" stop-color="#6E5F3C"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="#F4F1EA"/>
  <g transform="translate(2.8,0.6) scale(0.3)">
    <rect x="25" y="42" width="27" height="24" rx="8.5" fill="#7A663B"/>
    <rect x="33.5" y="50.5" width="10" height="10" rx="2.5" fill="#F4F1EA"/>
    <rect x="54" y="26" width="9.5" height="40" rx="4.75" fill="#7A663B"/>
    <rect x="16" y="73.4" width="56" height="3.6" rx="1.8" fill="url(#hg)"/>
  </g>
</svg>
