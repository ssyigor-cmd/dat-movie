      <path d="M0,0 m-4,0 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9"/>
      <path d="M0,0 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.9"/>
