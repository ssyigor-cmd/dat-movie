<svg width="180" height="180" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- datmovie apple-touch-icon (iOS/iPadOS "Adicionar à Tela de Início").
       Fundo opaco, sem transparência e SEM cantos arredondados: o iOS aplica
       máscara própria, e qualquer alfa aqui vira preto. Fundo papel claro,
       marca em preto suave e filete em degradê cinza escuro. -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26262A"/>
      <stop offset="0.35" stop-color="#3A3A40"/>
      <stop offset="0.7" stop-color="#57575F"/>
      <stop offset="1" stop-color="#74747D"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="#F4F1EA"/>
  <g transform="translate(-1.6,-4.6) scale(0.4)">
    <rect x="25" y="42" width="27" height="24" rx="8.5" fill="#141417"/>
    <rect x="33.5" y="50.5" width="10" height="10" rx="2.5" fill="#F4F1EA"/>
    <rect x="54" y="26" width="9.5" height="40" rx="4.75" fill="#141417"/>
    <rect x="16" y="73.4" width="56" height="3.6" rx="1.8" fill="url(#hg)"/>
  </g>
</svg>
