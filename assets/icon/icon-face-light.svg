<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Face Icon - Transparent Background (Light Theme) -->
  <g transform="translate(48, 48)">
    <!-- Face circle -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#08080F" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Left spiral eye - much larger for visible spiral -->
    <g transform="translate(-12, -8)">
      <path d="M0,0 m-10,0 a10,10 0 1,1 20,0 a10,10 0 1,1 -20,0" fill="none" stroke="#08080F" stroke-width="2.5" stroke-opacity="0.9"/>
      <path d="M0,0 m-7,0 a7,7 0 1,1 14,0 a7,7 0 1,1 -14,0" fill="none" stroke="#08080F" stroke-width="2" stroke-opacity="0.9"/>
      <path d="M0,0 m-4,0 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0" fill="none" stroke="#08080F" stroke-width="1.5" stroke-opacity="0.9"/>
      <path d="M0,0 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" fill="none" stroke="#08080F" stroke-width="1" stroke-opacity="0.9"/>
      <circle cx="0" cy="0" r="1.5" fill="#08080F" fill-opacity="0.9"/>
    </g>
    
    <!-- Right spiral eye - much larger for visible spiral -->
    <g transform="translate(12, -8)">
      <path d="M0,0 m-10,0 a10,10 0 1,1 20,0 a10,10 0 1,1 -20,0" fill="none" stroke="#08080F" stroke-width="2.5" stroke-opacity="0.9"/>
      <path d="M0,0 m-7,0 a7,7 0 1,1 14,0 a7,7 0 1,1 -14,0" fill="none" stroke="#08080F" stroke-width="2" stroke-opacity="0.9"/>
      <path d="M0,0 m-4,0 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0" fill="none" stroke="#08080F" stroke-width="1.5" stroke-opacity="0.9"/>
      <path d="M0,0 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" fill="none" stroke="#08080F" stroke-width="1" stroke-opacity="0.9"/>
      <circle cx="0" cy="0" r="1.5" fill="#08080F" fill-opacity="0.9"/>
    </g>
    
    <!-- V-shaped mouth - pointing down, lower position -->
    <path d="M-10,8 L0,18 L10,8" fill="none" stroke="#08080F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  </g>
</svg>