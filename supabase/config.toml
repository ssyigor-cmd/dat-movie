
[functions.fanart-logo]
enabled = true
# Exige sessão JWT válida. Sem isso a função é um proxy público e ilimitado
# para a API do Fanart, e qualquer pessoa na internet pode queimar a cota da chave.
verify_jwt = true
import_map = "./functions/fanart-logo/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/fanart-logo/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/fanart-logo/*.html" ]

[functions.clever-endpoint]
enabled = true
verify_jwt = true
entrypoint = "./functions/clever-endpoint/index.ts"
