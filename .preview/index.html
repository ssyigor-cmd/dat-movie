<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>datmovie · prévia iOS 390×844</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 32px 64px;
    background: #17181a;
    color: #f2ede3;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 32px; color: #9b978e; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 36px 28px;
    max-width: 1420px;
  }
  figure { margin: 0; }
  figure img {
    display: block;
    width: 100%;
    max-width: 390px;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
    background: #101112;
  }
  figcaption { margin-top: 12px; font-size: 13px; color: #b9b4aa; }
  figcaption b { display: block; color: #f2ede3; font-weight: 600; margin-bottom: 2px; }
</style>
</head>
<body>
  <h1>datmovie · iOS mobile-first</h1>
  <p class="sub">Prévia em 390 × 844 · dados de demonstração · uma única página isolada</p>
  <div class="grid">
    <figure>
      <img src="01-home-dark.png" alt="Tela Início no tema escuro" />
      <figcaption><b>1 · Início (escuro)</b>Hero, continuar, fila “Quero ver” e estante</figcaption>
    </figure>
    <figure>
      <img src="02-catalog-dark.png" alt="Tela Catálogo no tema escuro" />
      <figcaption><b>2 · Catálogo (escuro)</b>Busca, filtros por status e grade de 2 colunas</figcaption>
    </figure>
    <figure>
      <img src="03-detail-dark.png" alt="Ficha de uma série aberta sobre o catálogo" />
      <figcaption><b>3 · Ficha</b>Título, progresso, Tier em uma linha, pôster e status</figcaption>
    </figure>
    <figure>
      <img src="04-home-light.png" alt="Tela Início no tema claro" />
      <figcaption><b>4 · Início (claro)</b>Mesma anatomia com paleta areia clara</figcaption>
    </figure>
    <figure>
      <img src="05-upcoming-light.png" alt="Tela Próximos no tema claro" />
      <figcaption><b>5 · Próximos (claro)</b>A fila “Quero ver”: o que você decidiu que pretende assistir</figcaption>
    </figure>
    <figure>
      <img src="06-search-light.png" alt="Tela Pesquisar no tema claro" />
      <figcaption><b>6 · Pesquisar (claro)</b>Sugestões e descoberta com adição ao catálogo</figcaption>
    </figure>
    <figure>
      <img src="07-profile-light.png" alt="Tela Perfil no tema claro" />
      <figcaption><b>7 · Perfil (claro)</b>Preferências de tema e progresso, estatísticas e dados</figcaption>
    </figure>
  </div>
</body>
</html>
