name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Este passo é o que faltava. `no-undef` pegaria os 32 ReferenceError
      # que impediam o app de carregar: nem os testes nem o build detectam
      # referência a variável não declarada — só o navegador, em runtime.
      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
