name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 é o mínimo: @supabase/supabase-js v2.111 usa WebSocket global no
          # createClient (que roda no import de src/lib/supabase.js) e o Node 20
          # não tem — a suíte morria no import com "native WebSocket not found".
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Este passo é o que faltava. `no-undef` pegaria os 32 ReferenceError
      # que impediam o app de carregar: nem os testes nem o build detectam
      # referência a variável não declarada — só o navegador, em runtime.
      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
