<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dat-Movie · Catálogo</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <!-- Importmap para Supabase -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ==================== TELA DE LOGIN ==================== -->
  <div id="authContainer" style="position: fixed; inset: 0; background: var(--bg-primary); z-index: 300; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;">
    <div style="background: var(--bg-secondary); padding: 30px; border-radius: 24px; max-width: 400px; width: 100%; box-shadow: var(--glass-shadow);">
      <h2 style="text-align: center; margin-bottom: 20px; color: var(--text-primary);">Dat-Movie</h2>
      <form id="authForm">
        <div style="margin-bottom: 12px;">
          <label for="authEmail" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Email</label>
          <input type="email" id="authEmail" placeholder="seu@email.com" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--bg-primary); color: var(--text-primary);" required />
        </div>
        <div style="margin-bottom: 16px;">
          <label for="authPassword" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Senha</label>
          <input type="password" id="authPassword" placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--bg-primary); color: var(--text-primary);" required />
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
          <button type="submit" id="authLoginBtn" style="flex: 1; padding: 10px; background: var(--gradient-accent); color: white; border: none; border-radius: 40px; font-weight: 600; cursor: pointer;">Entrar</button>
          <button type="button" id="authSignupBtn" style="flex: 1; padding: 10px; background: var(--bg-glass); color: var(--text-secondary); border: 1px solid var(--glass-border); border-radius: 40px; font-weight: 600; cursor: pointer;">Cadastrar</button>
        </div>
        <div id="authMessage" style="text-align: center; margin-top: 12px; font-size: 0.85rem; color: var(--text-muted);"></div>
      </form>
    </div>
  </div>

  <!-- ==================== BOTÃO TEMA ==================== -->
  <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
    <i class="fas fa-moon"></i>
  </button>

  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" role="navigation">
    <div class="sidebar-header">
      <h2><i class="fas fa-film"></i> Dat-Movie</h2>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-tab="anime"><i class="fas fa-tv"></i> <span>Animes</span></button>
      <button class="nav-item" data-tab="animacao"><i class="fas fa-paint-brush"></i> <span>Animações</span></button>
      <button class="nav-item" data-tab="serie"><i class="fas fa-video"></i> <span>Séries</span></button>
      <button class="nav-item" data-tab="all"><i class="fas fa-th"></i> <span>Todos</span></button>
    </nav>
    <div class="sidebar-footer">
      <button id="exportBtn" class="nav-item"><i class="fas fa-download"></i> <span>Exportar</span></button>
      <button id="importBtn" class="nav-item"><i class="fas fa-upload"></i> <span>Importar</span></button>
    </div>
  </aside>

  <!-- ==================== CONTEÚDO PRINCIPAL ==================== -->
  <main class="main-content">
    <header class="main-header">
      <div>
        <h1>Meu Catálogo</h1>
        <p class="subtitle">Gerencie animes, animações e séries</p>
      </div>
      <div class="stats">
        <div class="stat-item"><span class="stat-number" id="totalCount">0</span><span class="stat-label">Total</span></div>
        <div class="stat-item"><span class="stat-number" id="animeCount">0</span><span class="stat-label">Animes</span></div>
        <div class="stat-item"><span class="stat-number" id="animacaoCount">0</span><span class="stat-label">Animações</span></div>
        <div class="stat-item"><span class="stat-number" id="serieCount">0</span><span class="stat-label">Séries</span></div>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar título..." />
      </div>
      <div class="filter-wrapper">
        <select id="filterStatus">
          <option value="todos">Todos</option>
          <option value="assistindo">Assistindo</option>
          <option value="concluido">Concluído</option>
          <option value="planejado">Planejado</option>
          <option value="pausado">Pausado</option>
        </select>
        <select id="filterTier">
          <option value="todos">Todos os Tiers</option>
          <option value="S+">S+</option>
          <option value="S">S</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="null">Sem tier</option>
        </select>
        <select id="sortOrder">
          <option value="nome-asc">Nome (A–Z)</option>
          <option value="nome-desc">Nome (Z–A)</option>
          <option value="progresso-asc">Progresso ↑</option>
          <option value="progresso-desc">Progresso ↓</option>
          <option value="data-asc">Mais antigo</option>
          <option value="data-desc" selected>Mais recente</option>
          <option value="tier-asc">Tier (melhor → pior)</option>
          <option value="tier-desc">Tier (pior → melhor)</option>
          <option value="temporada-asc">Temporada ↑</option>
          <option value="temporada-desc">Temporada ↓</option>
        </select>
      </div>
      <div class="toolbar-actions">
        <button id="groupToggle" class="tool-btn"><i class="fas fa-layer-group"></i></button>
        <select id="densitySelect" class="tool-btn">
          <option value="6">6 col</option>
          <option value="8" selected>8 col</option>
          <option value="10">10 col</option>
        </select>
        <button id="openFormBtn" class="tool-btn primary"><i class="fas fa-plus"></i> Adicionar</button>
      </div>
    </div>

    <section class="grid-section">
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <!-- ==================== MODAL DE ADIÇÃO / EDIÇÃO ==================== -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal modal-add">
      <div class="modal-header">
        <h2 id="modalTitle"><i class="fas fa-pen"></i> Adicionar título</h2>
        <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
      </div>
      <form id="form" autocomplete="off">

        <!-- Campo de pesquisa em destaque -->
        <div class="form-group search-group">
          <label for="nome"><i class="fas fa-search"></i> Buscar título</label>
          <input type="text" id="nome" placeholder="Ex: Scavengers Reign, Attack on Titan..." required />
        </div>

        <!-- Sugestões + Pré-visualização do pôster -->
        <div class="suggestions-wrapper">
          <div id="suggestions" class="suggestions" role="listbox"></div>
          <div id="posterPreview" class="poster-preview">
            <img id="previewImg" src="" alt="Pré-visualização" style="display:none;" />
            <span id="previewPlaceholder">Nenhuma imagem</span>
          </div>
        </div>

        <!-- Campos em grade 2x2 -->
        <div class="form-grid">
          <div class="form-group">
            <label for="tipo">Tipo</label>
            <select id="tipo" required>
              <option value="anime">Anime</option>
              <option value="animacao">Animação</option>
              <option value="serie">Série</option>
            </select>
          </div>
          <div class="form-group">
            <label for="temporada">Temporada</label>
            <select id="temporada" required>
              <option value="">Selecione</option>
            </select>
          </div>
          <div class="form-group">
            <label for="episodio">Episódio</label>
            <select id="episodio" required></select>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" required>
              <option value="assistindo">Assistindo</option>
              <option value="concluido">Concluído</option>
              <option value="planejado">Planejado</option>
              <option value="pausado">Pausado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tierForm">Tier</label>
            <select id="tierForm">
              <option value="">Selecione</option>
              <option value="S+">S+</option>
              <option value="S">S</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>
          <div class="form-group align-end">
            <button type="button" id="btnConcluido" class="btn-concluido">
              <i class="fas fa-check"></i> Concluído
            </button>
          </div>
        </div>

        <!-- Botões de ação -->
        <div class="form-actions">
          <button type="submit" id="btnSubmit"><i class="fas fa-save"></i> Salvar</button>
          <button type="button" id="btnCancel" class="secondary"><i class="fas fa-times"></i> Cancelar</button>
        </div>
        <div id="formLoading" class="form-loading" style="display:none;">
          <i class="fas fa-spinner fa-spin"></i> Carregando...
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== MODAL DE DETALHES ==================== -->
  <div class="modal-overlay" id="detailModal" role="dialog" aria-modal="true">
    <div class="modal modal-detail">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div id="detailTierBadge" class="tier-badge-large" style="display: none;">S</div>
          <h2 id="detailTitle"><i class="fas fa-info-circle"></i> Detalhes</h2>
        </div>
        <button class="modal-close" id="detailClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">

        <!-- Imagem + Sinopse -->
        <div class="detail-media">
          <div class="detail-poster">
            <img id="detailPosterImg" src="" alt="Pôster" />
          </div>
          <div class="detail-backdrop">
            <div class="backdrop-blur" id="detailBackdropBlur"></div>
            <div class="backdrop-content">
              <div id="detailLoading" class="form-loading"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>
              <p id="detailSinopse" class="detail-sinopse">Carregando sinopse...</p>
            </div>
          </div>
        </div>

        <!-- Metadados (anos e status) -->
        <div class="detail-meta">
          <span><i class="fas fa-calendar-alt"></i> <span id="detailStartYear">--</span> – <span id="detailEndYear">--</span></span>
          <span><i class="fas fa-clock"></i> <span id="detailStatusLabel">--</span></span>
        </div>

        <!-- Formulário de edição -->
        <div class="detail-form">
          <div class="form-row">
            <div class="form-group">
              <label for="detailTemporada"><i class="fas fa-layer-group"></i> Temporada</label>
              <select id="detailTemporada"></select>
            </div>
            <div class="form-group">
              <label for="detailEpisodio"><i class="fas fa-play"></i> Episódio</label>
              <select id="detailEpisodio"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="detailStatus"><i class="fas fa-flag-checkered"></i> Status</label>
              <select id="detailStatus">
                <option value="assistindo">Assistindo</option>
                <option value="concluido">Concluído</option>
                <option value="planejado">Planejado</option>
                <option value="pausado">Pausado</option>
              </select>
            </div>
            <div class="form-group">
              <label for="detailTier"><i class="fas fa-medal"></i> Tier</label>
              <select id="detailTier">
                <option value="">Selecione</option>
                <option value="S+">S+</option>
                <option value="S">S</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="detailTipo"><i class="fas fa-tag"></i> Tipo</label>
              <select id="detailTipo">
                <option value="anime">Anime</option>
                <option value="animacao">Animação</option>
                <option value="serie">Série</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" id="detailDelete"><i class="fas fa-trash"></i> Remover</button>
            <button type="button" id="detailSave"><i class="fas fa-save"></i> Salvar alterações</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== TOAST ==================== -->
  <div id="toast" class="toast" role="alert"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
